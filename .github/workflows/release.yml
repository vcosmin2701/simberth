name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to add a Homebrew bottle to
        required: true
        type: string

env:
  SIMBERTH_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        if: github.event_name == 'push'
        run: |
          SIMBERTH_VERSION="${SIMBERTH_RELEASE_TAG#v}"
          go test ./...
          go build -ldflags "-X main.version=${SIMBERTH_VERSION}" -o simberth ./cmd/simberth
          codesign --force --sign - simberth
          tar -czf "simberth-${SIMBERTH_RELEASE_TAG}-macos-arm64.tar.gz" simberth
          shasum -a 256 "simberth-${SIMBERTH_RELEASE_TAG}-macos-arm64.tar.gz"
      - name: Build Homebrew bottle
        run: |
          SIMBERTH_SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${SIMBERTH_RELEASE_TAG}.tar.gz"
          SIMBERTH_SOURCE_TARBALL="${RUNNER_TEMP}/simberth-source.tar.gz"
          SIMBERTH_BUILD_TAP="mobai-app/simberth-release"

          curl --fail --location --retry 3 "${SIMBERTH_SOURCE_URL}" --output "${SIMBERTH_SOURCE_TARBALL}"
          SIMBERTH_SOURCE_SHA256="$(shasum -a 256 "${SIMBERTH_SOURCE_TARBALL}" | cut -d ' ' -f 1)"

          brew tap-new --no-git "${SIMBERTH_BUILD_TAP}"
          SIMBERTH_FORMULA="$(brew --repository "${SIMBERTH_BUILD_TAP}")/Formula/simberth.rb"
          mkdir -p "$(dirname "${SIMBERTH_FORMULA}")"
          sed \
            -e "s|@SOURCE_URL@|${SIMBERTH_SOURCE_URL}|g" \
            -e "s|@SOURCE_SHA256@|${SIMBERTH_SOURCE_SHA256}|g" \
            packaging/homebrew/simberth.rb.in > "${SIMBERTH_FORMULA}"

          brew install --build-bottle "${SIMBERTH_BUILD_TAP}/simberth"
          brew test "${SIMBERTH_BUILD_TAP}/simberth"
          brew bottle \
            --json \
            --no-rebuild \
            --root-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${SIMBERTH_RELEASE_TAG}" \
            "${SIMBERTH_BUILD_TAP}/simberth"

          # brew uses a double dash locally; custom HTTP bottle URLs use one.
          for SIMBERTH_BOTTLE in simberth--*.bottle*.tar.gz; do
            mv "${SIMBERTH_BOTTLE}" "${SIMBERTH_BOTTLE/--/-}"
          done
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.SIMBERTH_RELEASE_TAG }}
          files: |
            simberth-*-macos-arm64.tar.gz
            simberth-*.bottle*.tar.gz
